  glue_crawler: |
    ```hcl
    data_pipeline_parameters = {
      "my-pipeline" = {
        crawlers = {
          "s3-crawler" = {
            description   = "Crawler for S3 data lake"
            database_name = "my_data_catalog"
            schedule      = "cron(0 12 * * ? *)"
            table_prefix  = "raw_"
            
            s3_target = [
              {
                path        = "s3://my-data-lake/raw-data/"
                exclusions  = ["*.tmp", "*.log"]
                sample_size = 100
              }
            ]
            
            schema_change_policy = {
              delete_behavior = "LOG"
              update_behavior = "UPDATE_IN_DATABASE"
            }
            
            lineage_configuration = {
              crawler_lineage_settings = "ENABLE"
            }
            
            recrawl_policy = {
              recrawl_behavior = "CRAWL_EVERYTHING"
            }
          },
          "jdbc-crawler" = {
            description   = "Crawler for JDBC database"
            database_name = "my_jdbc_catalog"
            
            jdbc_target = [
              {
                connection_name = "my-database-connection"
                path           = "mydb/public/%"
                exclusions     = ["temp_%"]
              }
            ]
          }
        }
      }
    }
    ```
