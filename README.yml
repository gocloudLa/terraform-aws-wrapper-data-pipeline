  step_function: |
    ```hcl
    data_pipeline_parameters = {
      "my-pipeline" = {
        orchestration = {
          "workflow" = {
            service     = "step-function"
            description = "Data pipeline orchestration workflow"
            type        = "STANDARD"
            
            definition = jsonencode({
              Comment = "Data Pipeline Workflow"
              StartAt = "StartJob"
              States = {
                StartJob = {
                  Type     = "Task"
                  Resource = "arn:aws:states:::glue:startJobRun.sync"
                  Parameters = {
                    JobName = "my-etl-job"
                  }
                  End = true
                }
              }
            })
            
            logging_configuration = {
              include_execution_data = true
              level                 = "ALL"
            }
            
            cloudwatch_log_group_retention_in_days = 30
            enable_xray_tracing                   = true
            
            iam_role_permissions = {
              create_glue_jobs_integration = true
              create_sns_integration      = true
            }
            
            scheduler = {
              "daily-schedule" = {
                cron     = "cron(0 9 * * ? *)"
                timezone = "America/New_York"
                input    = jsonencode({
                  Arguments = {
                    "--env" = "production"
                  }
                })
              }
            }
            
            encryption_configuration = {
              kms_key_id = "arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012"
              type       = "CUSTOMER_MANAGED_KMS_KEY"
            }
          }
        }
      }
    }
    ```
    ## Step Function Variables
    | Name | Description | Type | Default | Required |
    |------|-------------|------|---------|:--------:|
    | create | If it is true, the resources will be created | `bool` | `true` | no |
    | name | Name of the resources to be created | `string` | n/a | yes |
    | description | Resources description | `string` | `null` | no |
    | definition | The Amazon States Language definition | `any` | n/a | yes |
    | type | State machine type (STANDARD, EXPRESS) | `string` | `"STANDARD"` | no |
    | publish | Set to true to publish a version | `bool` | `false` | no |
    | logging_configuration | Execution history events logging configuration | `map(string)` | `{level = "ON"}` | no |
    | cloudwatch_log_group_retention_in_days | Log retention in days | `number` | `30` | no |
    | encryption_configuration | Encryption configuration | `map(any)` | n/a | yes |
    | enable_xray_tracing | Enable AWS X-Ray tracing | `bool` | `false` | no |
    | iam_role_permissions | List of resources managed from the state machine | `map(any)` | `{}` | no |
    | scheduler | Map of EventBridge schedulers | `map(any)` | `{}` | no |
    | tags | A mapping of tags to assign to resources | `map(string)` | n/a | yes |

