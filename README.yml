module_name: Terraform AWS Data Pipeline Module
module_description: The Terraform wrapper for AWS Data Pipeline simplifies the orchestration and deployment of data transformation and processing services in AWS. This wrapper functions as a standardized template that abstracts technical complexity and allows building reusable data pipelines that integrate AWS Glue Jobs, Glue Connectors, Parameter Store, Step Functions, and EventBridge.
module_badges:
  - url: "https://github.com/gocloudLa/terraform-aws-data-pipeline/releases/latest"
    image: "https://img.shields.io/github/v/release/gocloudLa/terraform-aws-data-pipeline.svg?style=for-the-badge"
    alt: "Latest Release"
  - url: ""
    image: "https://img.shields.io/github/last-commit/gocloudLa/terraform-aws-data-pipeline.svg?style=for-the-badge"
    alt: "Last Commit"
  - url: "https://registry.terraform.io/modules/gocloudLa/data-pipeline/aws"
    image: "https://img.shields.io/badge/Terraform-Registry-7B42BC?style=for-the-badge&logo=terraform&logoColor=white"
    alt: "Terraform Registry"
quick_start: |
  ```hcl
  module "wrapper_data_pipeline" {
    source = "../../"
    metadata = local.metadata

    data_pipeline_parameters = {
      "datapipeline-example" = {
        connectors = {
          "connector" = {
            connection_type = "NETWORK"
            physical_connection_requirements = {
              subnet_id              = data.aws_subnets.private-prd.ids[0]
              security_group_id_list = []
            }
          }
        }
        jobs = {
          "etl-01" = {
            description  = "Glue Job that runs Python script"
            max_retries  = 0
            max_capacity = 1
            timeout      = 120
            glue_version = "5.0"

            connections = ["${local.common_name}-datapipeline-example-connector"]

            role_custom_policy = local.default_role_policy

            non_overridable_arguments = local.default_non_overridable_arguments

            default_arguments = {
              "--landing-zone"    = "${module.s3_storage_bucket.s3_bucket_id}"
              "--job-directory"   = "s3://${module.s3_etl_bucket.s3_bucket_id}/ETL/ETL-01"
            }

            command = {
              name            = "pythonshell"
              script_location = "s3://${module.s3_etl_bucket.s3_bucket_id}/ETL/ETL-01/main.py"
              python_version  = "3.9"
            }
          }
        }
        orchestration = {
          "workflow-01" = {
            service    = "step-function"
            definition = local.step_functions_workflow_01_definition
            scheduler = {
              "schedule" = {
                cron     = "cron(0 12 * * ? *)"
                timezone = "America/Argentina/Buenos_Aires"
                input    = "{\"Arguments\": {\"--scriptLocation\": \"s3://my-bucket/path/to/new_script.py\"}}"
              }
            }

            logging_configuration = {
              include_execution_data = true
              level                  = "ALL"
            }
            iam_role_permissions = {
              create_glue_jobs_integration = true
            }
          }
        }
      }
    }
  }
  ```
features:
  - icon: 🔧
    title: Glue Jobs Management
    short_description: Manages AWS Glue Jobs for serverless ETL processing
    long_description: |
      Deploy and manage AWS Glue Jobs that execute serverless ETL processes. Configure job parameters, connections, arguments, timeouts, and retry policies.
      ```hcl
      data_pipeline_parameters = {
        "my-pipeline" = {
          jobs = {
            "etl-job" = {
              description               = "ETL job for data processing"
              glue_version             = "5.0"
              max_retries              = 2
              max_capacity             = 2
              timeout                  = 180
              execution_class          = "STANDARD"
              worker_type              = "G.1X"
              number_of_workers        = 2
              create_parameter_store   = true
              custom_parameter_store_name = "/my-pipeline/etl-job/config"

              connections = ["my-database-connection"]

              role_custom_policy = {
                Version = "2012-10-17"
                Statement = [
                  {
                    Effect = "Allow"
                    Action = ["s3:GetObject", "s3:PutObject"]
                    Resource = ["arn:aws:s3:::my-bucket/*"]
                  }
                ]
              }

              default_arguments = {
                "--source-bucket" = "my-source-bucket"
                "--target-bucket" = "my-target-bucket"
              }

              non_overridable_arguments = {
                "--enable-metrics" = "true"
                "--enable-auto-scaling" = "true"
              }

              command = {
                name            = "glueetl"
                script_location = "s3://my-scripts-bucket/etl-script.py"
                python_version  = "3"
              }

              execution_property = {
                max_concurrent_runs = 1
              }

              notification_property = {
                notify_delay_after = 60
              }
            }
          }
        }
      }
      ```
      ## Glue Job Variables
      | Name | Description | Type | Default | Required |
      |------|-------------|------|---------|:--------:|
      | create | If it is true, the resources will be created | `bool` | `true` | no |
      | name | Glue job name | `string` | n/a | yes |
      | description | Glue job description | `string` | `null` | no |
      | role_custom_policy | A map of IAM policies for the job service role | `any` | n/a | yes |
      | connections | The list of connections used for this job | `list(string)` | `null` | no |
      | glue_version | The version of Glue to use | `string` | `"4.0"` | no |
      | create_parameter_store | Enables the creation of a custom parameter store | `bool` | `false` | no |
      | custom_parameter_store_name | Custom name for the parameter created | `string` | `null` | no |
      | default_arguments | The map of default arguments for the job | `map(string)` | `null` | no |
      | non_overridable_arguments | Non-overridable arguments for this job | `map(string)` | `null` | no |
      | security_configuration | The name of the Security Configuration | `string` | `null` | no |
      | timeout | The job timeout in minutes | `number` | `180` | no |
      | execution_class | Execution class (FLEX, STANDARD) | `string` | `"STANDARD"` | no |
      | max_capacity | Maximum number of DPUs | `number` | `null` | no |
      | max_retries | Maximum number of times to retry the job | `number` | `null` | no |
      | worker_type | Type of predefined worker (Standard, G.1X, G.2X) | `string` | `null` | no |
      | number_of_workers | Number of workers of a defined worker_type | `number` | `null` | no |
      | command | The command of the job | `map(any)` | n/a | yes |
      | execution_property | Execution property of the job | `object` | `null` | no |
      | notification_property | Notification property of the job | `object` | `null` | no |
      | tags | A mapping of tags to assign to resources | `map(string)` | n/a | yes |
    
  - icon: 🔗
    title: Glue Connectors
    short_description: Integrates data sources and destinations through Glue Connectors
    long_description: |
      Configure Glue Connectors to integrate various data sources and destinations with your data pipeline.
  - icon: 📊
    title: Parameter Store Integration
    short_description: Manages secure and reusable configurations
    long_description: |
      Store and manage pipeline configurations securely using AWS Parameter Store for reusable and centralized configuration management.
  - icon: 🔄
    title: Step Functions Orchestration
    short_description: Orchestrates complex workflow processes
    long_description: |
      Use AWS Step Functions to orchestrate complex data pipeline workflows with scheduling, error handling, and state management.
  - icon: 📅
    title: EventBridge Scheduling
    short_description: Programs and triggers pipeline events
    long_description: |
      Configure EventBridge for scheduling and triggering events that initiate or coordinate data pipeline processes.
  - icon: 🔐
    title: Security Configuration
    short_description: Manages security policies and permissions
    long_description: |
      Automatically handles security aspects including IAM roles, policies, and permissions for all pipeline components.
  - icon: ⚙️
    title: Custom Policies
    short_description: Supports custom IAM policies and configurations
    long_description: |
      Define and apply custom IAM policies and configurations tailored to specific pipeline requirements.
  - icon: 🔌
    title: Connections Integration
    short_description: Manages connections to external data sources
    long_description: |
      Configure and manage connections to external data sources and services within your data pipeline.
  - icon: 📝
    title: Arguments Definition
    short_description: Configures job arguments and parameters
    long_description: |
      Define default and non-overridable arguments for Glue jobs to ensure consistent execution parameters.
  - icon: ⏱️
    title: Timeouts and Retry Configuration
    short_description: Manages execution timeouts and retry policies
    long_description: |
      Configure execution timeouts and maximum retry attempts to ensure reliable pipeline execution.
important_notes: |
  - **🚨 Job Configuration:** Changes to Glue job configurations may require redeployment. Test thoroughly in development environments.
  - **⚠️ IAM Permissions:** Ensure proper IAM permissions are configured for cross-service integrations.
  - **ℹ️ Resource Limits:** Monitor Glue job capacity and Step Function execution limits to avoid throttling.
