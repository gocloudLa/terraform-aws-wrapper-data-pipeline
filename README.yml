  glue_connector: |
    ```hcl
    data_pipeline_parameters = {
      "my-pipeline" = {
        connectors = {
          "database-connector" = {
            description     = "Connection to PostgreSQL database"
            connection_type = "JDBC"
            
            connection_properties = {
              JDBC_CONNECTION_URL = "jdbc:postgresql://db.example.com:5432/mydb"
              USERNAME           = "dbuser"
              PASSWORD           = "dbpassword"
            }
            
            physical_connection_requirements = {
              subnet_id              = "subnet-12345678"
              security_group_id_list = ["sg-12345678"]
            }
            
            match_criteria = ["connection-criteria"]
          },
          "network-connector" = {
            description     = "Network connection for VPC resources"
            connection_type = "NETWORK"
            
            physical_connection_requirements = {
              subnet_id              = "subnet-87654321"
              security_group_id_list = ["sg-87654321"]
            }
          }
        }
      }
    }
    ```
    ## Glue Connector Variables
    | Name | Description | Type | Default | Required |
