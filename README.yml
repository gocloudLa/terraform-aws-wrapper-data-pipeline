    | jdbc_target | List of nested JDBC target arguments | `list(any)` | `null` | no |
    | dynamodb_target | List of nested DynamoDB target arguments | `list(any)` | `null` | no |
    | s3_target | List of nested Amazon S3 target arguments | `list(any)` | `null` | no |
    | mongodb_target | List of nested MongoDB target arguments | `list(any)` | `null` | no |
